<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: linear-gradient(to right, #00c6ff, #0072ff);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .todo-container {
            background: white;
            padding: 20px;
            border-radius: 15px;
            width: 350px;
            box-shadow: 0 0 15px rgba(0,0,0,0.3);
            animation: fadeIn 1s ease;
        }

        h2 {
            text-align: center;
        }

        .input-section {
            display: flex;
            margin-bottom: 15px;
        }

        input {
            flex: 1;
            padding: 10px;
            border-radius: 10px;
            border: 1px solid #ccc;
        }

        button {
            padding: 10px;
            margin-left: 5px;
            border: none;
            border-radius: 10px;
            background: #0072ff;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background: #00c6ff;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #f4f4f4;
            padding: 10px;
            margin: 8px 0;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            animation: slideIn 0.3s ease;
        }

        li.completed {
            text-decoration: line-through;
            background: #d4edda;
        }

        .delete-btn {
            background: red;
        }

        .delete-btn:hover {
            background: darkred;
        }

        /* Animations */
        @keyframes fadeIn {
            from {opacity: 0;}
            to {opacity: 1;}
        }

        @keyframes slideIn {
            from {transform: translateX(-20px); opacity: 0;}
            to {transform: translateX(0); opacity: 1;}
        }

    </style>
</head>

<body>

<div class="todo-container">
    <h2>To-Do List</h2>

    <div class="input-section">
        <input type="text" id="taskInput" placeholder="Enter task...">
        <button onclick="addTask()">Add</button>
    </div>

    <ul id="taskList"></ul>
</div>

<script>
    function addTask() {
        let input = document.getElementById("taskInput");
        let taskText = input.value;

        if (taskText === "") {
            alert("Please enter a task");
            return;
        }

        let li = document.createElement("li");
        li.textContent = taskText;

        // Mark complete
        li.onclick = function() {
            li.classList.toggle("completed");
        };

        // Delete button
        let delBtn = document.createElement("button");
        delBtn.textContent = "X";
        delBtn.className = "delete-btn";

        delBtn.onclick = function(event) {
            event.stopPropagation();
            li.remove();
        };

        li.appendChild(delBtn);
        document.getElementById("taskList").appendChild(li);

        input.value = "";
    }
</script>

</body>
</html>
